<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="tongue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <clipPath id="mouth">
      <path d="M330 436 Q512 404 694 436 C690 560 604 616 512 616 C420 616 334 560 330 436 Z"/>
    </clipPath>
  </defs>
  <!-- macOS-style squircle with margin so it lines up with other Dock icons (same frame as Clumsee) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- selection corners: a box whose sides never meet -->
  <g fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 400 V260 H400"/>
    <path d="M624 260 H764 V400"/>
    <path d="M764 624 V764 H624"/>
    <path d="M400 764 H260 V624"/>
  </g>
  <!-- open, talking mouth where Clumsee has its eye -->
  <path d="M330 436 Q512 404 694 436 C690 560 604 616 512 616 C420 616 334 560 330 436 Z" fill="#2e1065"/>
  <g clip-path="url(#mouth)">
    <!-- upper teeth -->
    <path d="M392 400 H632 V452 Q632 470 614 470 H410 Q392 470 392 452 Z" fill="#fff"/>
    <!-- tongue -->
    <ellipse cx="512" cy="624" rx="128" ry="76" fill="url(#tongue)"/>
  </g>
  <!-- lips: same round-capped white stroke language as the corners -->
  <path d="M330 436 Q512 404 694 436 C690 560 604 616 512 616 C420 616 334 560 330 436 Z" fill="none" stroke="#fff" stroke-width="44" stroke-linejoin="round"/>
</svg>
